apiVersion: 1

groups:
  - orgId: 1
    name: host-resources
    folder: Infrastructure
    interval: 1m
    rules:
      - uid: host-cpu-high
        title: Host CPU usage high
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "CPU usage on {{ $labels.instance }} has been above 90% for 5 minutes."
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              instant: true
              expr: >-
                100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [90]

      - uid: host-memory-low
        title: Host available memory low
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Available memory on {{ $labels.instance }} has been below 10% for 5 minutes."
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              instant: true
              expr: >-
                (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [90]

      - uid: node-exporter-down
        title: node-exporter target down
        condition: B
        for: 2m
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: "Prometheus has not been able to scrape node-exporter for 2 minutes — host metrics are blind."
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              instant: true
              expr: 'up{job="node-exporter"}'
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
