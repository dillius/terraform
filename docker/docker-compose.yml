# Shared infra stack. Deployed by null_resource.host_config (host.tf) to
# /home/ubuntu/scripts/infra — including this file, otelcol-config, grafana
# provisioning, and a generated .env (secrets are not committed).
#
# mem_limits assume ~4 GiB host RAM (e.g. Rumble s1a.medium). Shrink limits or
# drop services before using a smaller flavor.
#
# Watchtower only updates containers labeled
# com.centurylinklabs.watchtower.enable=true (Postgres is intentionally unlabeled).

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    mem_limit: 384m
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=50
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - shared-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  watchtower:
    image: nickfedor/watchtower:1.20.2
    container_name: watchtower
    restart: unless-stopped
    mem_limit: 64m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_SCHEDULE=0 0 * * *   # daily at midnight
      - WATCHTOWER_ROLLING_RESTARTS=true
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      - shared-network

  portainer:
    image: portainer/portainer-ce:2.27.9
    container_name: portainer
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - ./portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      - shared-network
    # No ports published — access via NPM (portainer.yourdomain.com)

  npm:
    image: jc21/nginx-proxy-manager:2.12.3
    container_name: nginx-proxy-manager
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "80:80"      # HTTP
      - "443:443"    # HTTPS
      - "81:81"      # Admin UI — lock down via allowed_admin_cidrs (security group)
    environment:
      - DB_SQLITE_FILE=/data/database.sqlite
    volumes:
      - ./npm_data:/data
      - ./letsencrypt:/etc/letsencrypt
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      - shared-network
    # Uses SQLite; postgres above is for your apps on shared-network, not NPM.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  lgtm:
    image: grafana/otel-lgtm:0.30.0
    container_name: grafana-lgtm
    restart: unless-stopped
    mem_limit: 1g
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
    volumes:
      - ./lgtm_data:/data
      - ./otelcol-config.yaml:/otel-lgtm/otelcol-config.yaml:ro
      - ./grafana-provisioning/alerting:/otel-lgtm/grafana/conf/provisioning/alerting:ro
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      - shared-network
    depends_on:
      - node-exporter
      - cadvisor
    # No ports published — access Grafana via NPM (grafana.yourdomain.com → lgtm:3000)
    # OTLP: lgtm:4317 (gRPC) / lgtm:4318 (HTTP) on shared-network

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    restart: unless-stopped
    mem_limit: 64m
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host/root'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      - shared-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    mem_limit: 256m
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - '--disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,process,referenced_memory,resctrl,sched,tcp,udp,percpu,diskIO'
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      - shared-network

networks:
  shared-network:
    name: shared-network
    driver: bridge
