services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    mem_limit: 384m
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=50
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-me-to-a-strong-password}
      - POSTGRES_DB=postgres
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - shared-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    mem_limit: 64m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 * * *   # daily at midnight
      - WATCHTOWER_ROLLING_RESTARTS=true
    networks:
      - shared-network

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - ./portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - shared-network
    # No ports published — access via NPM (portainer.yourdomain.com)

  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "80:80"      # HTTP
      - "443:443"    # HTTPS
      - "81:81"      # Admin UI (you can restrict this later with firewall or NPM itself)
    environment:
      - DB_SQLITE_FILE=/data/database.sqlite
    volumes:
      - ./npm_data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - shared-network
    depends_on:
      - postgres
    extra_hosts:
     - "host.docker.internal:host-gateway"

  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: grafana-lgtm
    restart: unless-stopped
    mem_limit: 1g
    environment:
      # The image defaults to anonymous access with Admin role — lock that
      # down. CHANGE-ME-grafana-admin-password is a placeholder — replace it.
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=CHANGE-ME-grafana-admin-password
    volumes:
      - ./lgtm_data:/data
      - ./otelcol-config.yaml:/otel-lgtm/otelcol-config.yaml:ro
      - ./grafana-provisioning/alerting:/otel-lgtm/grafana/conf/provisioning/alerting:ro
    networks:
      - shared-network
    depends_on:
      - node-exporter
      - cadvisor
    # No ports published — access Grafana via NPM (grafana.yourdomain.com → lgtm:3000)
    # OTLP receivers are available internally on lgtm:4317 (gRPC) / lgtm:4318 (HTTP)
    # otelcol-config.yaml adds a Prometheus receiver that scrapes node-exporter and
    # cadvisor, feeding host/container CPU+mem into the same bundled Prometheus.

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    mem_limit: 64m
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host/root'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - shared-network
    # No ports published — scraped internally by lgtm's otelcol on node-exporter:9100

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    mem_limit: 256m
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - '--disable_metrics=accelerator,cpu_topology,hugetlb,percpu,resctrl,sched,tcp,udp,diskIO'
    networks:
      - shared-network
    # No ports published — scraped internally by lgtm's otelcol on cadvisor:8080

networks:
  shared-network:
    name: shared-network
    driver: bridge
